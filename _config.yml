# ════════════════════════════════════════════════════════════════
#  GitHub Pages — configuration
#
#  BUT UNIQUE : ne servir sur Pages qu'UNE seule URL de jeu, `index.html`.
#
#  ⚠ Depuis 14.55 il n'y a plus que DEUX éditions, et le fichier SOURCE
#  `Archipel_industry_alpha-7.html` EST l'édition PUBLIQUE (`DEV_BUILD = false`) :
#  il n'expose ni le mode développeur ni le mode rapide. On continue de l'exclure
#  de Pages — non plus par danger, mais pour ne pas servir une SECONDE copie du
#  jeu qui divergerait de `index.html` au fil des builds.
#
#  ⚠ Le fichier RESTE dans le dépôt Git — la CI en a besoin :
#     Archipel_industry_alpha-7.html  (source = édition PUBLIQUE)
#        ├─→ game-public.html  → ArchipelIndustry.apk    (édition publique)
#        │                     → index.html (PWA publique — assertion CI BLOQUANTE)
#        │                     → game-store.html → .aab fr.archipel.industry.store
#        │                        (variante MAGASIN depuis le build 425 : SELF_UPDATE = false,
#        │                         pas de lien de soutien, 0 permission)
#        └─→ game-dev.html     → ArchipelIndustryDev.apk (édition dev, DEV_BUILD = true)
#
#  `exclude` n'agit QUE sur la publication Pages, jamais sur Git.
#
#  Résultat :
#    https://freredoc.github.io/Archipel-Industry-/                        → ✅ jeu (édition publique)
#    https://freredoc.github.io/Archipel-Industry-/Archipel_industry_alpha-7.html → ❌ 404
# ════════════════════════════════════════════════════════════════

exclude:
  # Source du jeu : une seule URL de jeu servie, et c'est `index.html`.
  - Archipel_industry_alpha-7.html

  # Variantes intermédiaires produites par la CI (au cas où un run les laisse traîner).
  # ⚠ `game-dev.html` est la SEULE réellement dangereuse (DEV_BUILD = true → construction
  # gratuite pour qui trouve l'URL) : ne JAMAIS la retirer de cette liste.
  # `game-tester.html` n'est plus produit depuis 14.55 ; gardé par sûreté (vieux run).
  - game-public.html
  - game-dev.html
  - game-tester.html
  # `game-store.html` est produit A LA RACINE par l'etape magasin (`cp game-public.html
  # game-store.html`) et manquait a cette liste : un run qui la laisse trainer la servirait
  # comme seconde copie du jeu. Pas dangereuse (DEV_BUILD = false), mais elle divergerait
  # d'`index.html` au fil des builds, ce qui est exactement le but de ce fichier d'empecher.
  - game-store.html

  # Coquille Android et outillage : sans objet sur le web.
  - android/
  - .github/
  # Lot S — SOURCES du monolithe. `src/index.src.html` est une page de jeu AMPUTEE de ses
  # sprites (le marqueur d'injection n'est remplace qu'au build) : la servir donnerait une
  # SECONDE URL de jeu, cassee, ce que ce fichier existe precisement pour empecher.
  # `tools/` est de l'outillage, comme `android/`.
  - src/
  - tools/

# Pas de thème, pas de plugins : le dépôt sert des fichiers statiques.
# `index.html` n'a pas de front-matter → Jekyll le copie tel quel, sans
# jamais interpréter son contenu (vérifié : 0 occurrence de {{ }} ou {% %}).
theme: null
plugins: []
