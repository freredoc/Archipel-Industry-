name: Build Android APK

# Construit DEUX APK Android (coquilles WebView autour du MÊME jeu HTML) et les
# publie dans une Release "apk-latest", facile à installer depuis le téléphone :
#  - ArchipelIndustry.apk     : édition PUBLIQUE (DEV_BUILD=false : SANS mode
#    développeur ni mode rapide), appId `fr.archipel.industry.pub`.
#    Libellé « Archipel Industry ». C'est elle qui alimente aussi `index.html`
#    (PWA / navigateur — seul canal des utilisateurs Apple).
#  - ArchipelIndustryDev.apk  : édition DEV (jeu complet : mode dev + mode rapide),
#    appId d'ORIGINE `fr.archipel.industry`. Libellé « Archipel Ind. Dev ».
#    L'appId d'origine reste sur la DEV parce que c'est le seul APK installé
#    aujourd'hui : le conserver préserve son dossier de données WebView, donc la
#    sauvegarde. L'édition publique prend un appId neuf que personne n'a.
# Les deux s'installent côte à côte. Toute mise à jour du jeu produit les deux d'un coup.
#
# ⚠ Les étapes à EFFET DE BORD (Sync version.json → push sur main, Publish → release)
# sont gatées sur `refs/heads/main`. Un `workflow_dispatch` depuis une branche construit
# et téléverse les artefacts SANS rien publier — c'est fait pour pouvoir vérifier une
# branche sans annoncer une version aux joueurs.
on:
  workflow_dispatch:            # bouton "Run workflow" dans l'onglet Actions
  push:
    branches: [main]
    paths:
      - 'Archipel_industry_alpha-7.html'
      - 'android/**'
      - '.github/workflows/android.yml'
      - 'sw.js'
      - 'manifest.json'

permissions:
  contents: write               # nécessaire pour créer la Release

concurrency:
  # ⚠ CLÉ PAR REF, et pas un groupe global : le gate de branche encourage les dispatches de
  # vérification depuis une branche. Avec un groupe unique + cancel-in-progress, un tel dispatch
  # ANNULERAIT le run `main` en cours — potentiellement entre le `gh release delete` et le
  # `gh release create` de l'étape Publish, ce qui DÉTRUIRAIT la release. Chaque ref a donc sa
  # file : une branche ne peut plus interrompre main.
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          # API 36 (Android 16) : `compileSdk 36` exige la plateforme 36, et `buildToolsVersion`
          # est ÉPINGLÉ à 36.0.0 dans app/build.gradle — les deux doivent bouger ensemble.
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          # ⚠ L'étape « Assert appIds » cherche aapt2 dans $ANDROID_HOME/build-tools/*/ et ÉCHOUE
          # si elle n'en trouve aucun : on vérifie ici, tôt, que la nouvelle version est bien là.
          ls "$ANDROID_HOME"/build-tools/36.0.0/aapt2 \
            || { echo "::error::build-tools;36.0.0 absent — aapt2 introuvable pour Assert appIds"; exit 1; }

      - name: Prepare game files (public + dev + magasin)
        run: |
          mkdir -p android/app/src/main/assets
          # Le fichier versionné EST l'édition publique (DEV_BUILD = false).
          cp Archipel_industry_alpha-7.html game-public.html
          sed 's/^const DEV_BUILD = false;$/const DEV_BUILD = true;/' \
            Archipel_industry_alpha-7.html > game-dev.html
          # Garde-fous : le flag doit avoir réellement basculé dans la variante dev, et
          # surtout NE PAS l'être dans la publique (c'est elle qui part en PWA).
          grep -q "^const DEV_BUILD = true;$" game-dev.html \
            || { echo "::error::DEV_BUILD non basculé — vérifier la ligne const dans le HTML"; exit 1; }
          grep -q "^const DEV_BUILD = false;$" game-public.html \
            || { echo "::error::game-public.html n'est pas l'édition publique"; exit 1; }
          # --- Variante MAGASIN (Play / App Store) -------------------------------------
          # Dérivée de l'édition PUBLIQUE. Deux substitutions, même motif que DEV_BUILD
          # (ligne EXACTE, avec grep de garde À L'ENTRÉE et À LA SORTIE) :
          #   - SELF_UPDATE = false : plus de fetch de version.json au lancement, plus de
          #     bouton « Vérifier les mises à jour », plus de bloc updStatus. Installer un
          #     binaire téléchargé est interdit par la politique Google (et Apple 2.5.2).
          #   - SUPPORT_URL = ''   : le lien de soutien doit être ABSENT de l'artefact, pas
          #     masqué (Apple 3.1.1 exclut dons/pourboires de l'entitlement de lien externe).
          # ⚠ Cette variante n'alimente AUCUN APK de ce workflow : les paquets magasin
          # exigent une coquille native distincte (sans REQUEST_INSTALL_PACKAGES ni pont
          # ArchipelNative.update) qui n'existe pas encore. Elle est produite et téléversée
          # en artefact pour être empaquetée à part. NE PAS la brancher sur game-public.html :
          # la PWA et l'APK sideloadée sont HORS magasin et gardent lien + auto-updater.
          cp game-public.html game-store.html
          grep -q "^const SELF_UPDATE = true;$" game-store.html \
            || { echo "::error::SELF_UPDATE introuvable — ligne const renommée/reformatée ?"; exit 1; }
          grep -q "^const SUPPORT_URL = 'https://ko-fi.com/freredoc';$" game-store.html \
            || { echo "::error::SUPPORT_URL introuvable — ligne const renommée/reformatée ?"; exit 1; }
          sed -i "s|^const SELF_UPDATE = true;$|const SELF_UPDATE = false;|" game-store.html
          sed -i "s|^const SUPPORT_URL = 'https://ko-fi.com/freredoc';$|const SUPPORT_URL = '';|" game-store.html
          [ "$(grep -c 'ko-fi' game-store.html)" = "0" ] \
            || { echo "::error::le lien de soutien subsiste dans la variante magasin"; exit 1; }
          [ "$(grep -c 'const SELF_UPDATE = true;' game-store.html)" = "0" ] \
            || { echo "::error::SELF_UPDATE non basculé dans la variante magasin"; exit 1; }
          # Contre-garde : la publique (PWA + APK sideloadée) DOIT, elle, conserver les deux.
          grep -q "^const SELF_UPDATE = true;$" game-public.html \
            || { echo "::error::l'edition publique a perdu son auto-updater"; exit 1; }
          [ "$(grep -c 'ko-fi' game-public.html)" = "1" ] \
            || { echo "::error::l'edition publique a perdu son lien de soutien"; exit 1; }

      - name: Decode signing keystore (if secret is set)
        env:
          KS: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > android/app/keystore.jks
            echo "Signing keystore decoded — APK will use the stable key."
          else
            echo "No SIGNING_KEYSTORE_B64 secret — building with the default debug key."
          fi

      # ⚠ ORDRE VOULU : la PUBLIQUE (qui passe -PappId) est construite AVANT la DEV (qui
      # l'omet et doit retomber sur l'appId d'origine) — ainsi l'assertion d'appId de la dev
      # ne peut pas être satisfaite par un reste de la publique.
      - name: Build PUBLIC APK (Archipel Industry)
        working-directory: android
        run: |
          chmod +x ./gradlew
          BUILD=$(grep -oP "const GAME_BUILD = \K[0-9]+" ../Archipel_industry_alpha-7.html | head -1)
          VERSION=$(grep -oP "const GAME_VERSION = '\K[^']+" ../Archipel_industry_alpha-7.html | head -1)
          echo "versionCode=$BUILD versionName=$VERSION"
          cp ../game-public.html app/src/main/assets/index.html
          # ⚠ ASSERTION BLOQUANTE, symétrique de celle de la PWA : on vérifie l'édition SUR
          # L'ASSET RÉELLEMENT EMBARQUÉ, pas seulement sur le fichier intermédiaire. C'est
          # l'invariant central du lot (l'edition publique n'a pas le mode développeur).
          grep -q "^const DEV_BUILD = false;$" app/src/main/assets/index.html \
            || { echo "::error::l'asset embarque dans l'APK PUBLIQUE n'est pas l'edition publique"; exit 1; }
          ./gradlew assembleDebug --no-daemon --stacktrace \
            -Pvcode="${BUILD:-1}" -Pvname="${VERSION:-1.0}" \
            -PappId="fr.archipel.industry.pub" \
            -PappLabel="Archipel Industry"
          cp app/build/outputs/apk/debug/app-debug.apk ../ArchipelIndustry.apk

      - name: Build DEV APK (Archipel Ind. Dev)
        working-directory: android
        run: |
          BUILD=$(grep -oP "const GAME_BUILD = \K[0-9]+" ../Archipel_industry_alpha-7.html | head -1)
          VERSION=$(grep -oP "const GAME_VERSION = '\K[^']+" ../Archipel_industry_alpha-7.html | head -1)
          cp ../game-dev.html app/src/main/assets/index.html
          # Assertion miroir de celle de la publique : l'asset embarqué doit être l'édition DEV
          # (attrape une inversion de `cp` entre les deux builds).
          grep -q "^const DEV_BUILD = true;$" app/src/main/assets/index.html \
            || { echo "::error::l'asset embarque dans l'APK DEV n'est pas l'edition dev"; exit 1; }
          # PAS de -PappId : la dev garde l'appId d'ORIGINE (fr.archipel.industry) pour
          # continuer à mettre à jour l'app déjà installée sans perdre sa sauvegarde.
          ./gradlew assembleDebug --no-daemon --stacktrace \
            -Pvcode="${BUILD:-1}" -Pvname="${VERSION:-1.0}" \
            -PappLabel="Archipel Ind. Dev"
          cp app/build/outputs/apk/debug/app-debug.apk ../ArchipelIndustryDev.apk

      # Paquet MAGASIN (Play). Ajouté APRÈS les deux APK, sans toucher aux étapes existantes.
      # `-PstoreBuild=true` sélectionne AndroidManifest-store.xml (zéro permission) et met
      # BuildConfig.SELF_UPDATE à false. On produit DEUX artefacts du même jeu de sources :
      #  - le .aab, format de dépôt Play (non installable) ;
      #  - l'APK équivalent, qui SERT DE BANC : `aapt2 dump badging` ne lit pas un .aab, alors
      #    qu'il donne sur l'APK le paquet, le targetSdk, les permissions et l'état debuggable.
      # ⚠ appId `fr.archipel.industry.store` : Play App Signing donnera au paquet magasin une clé
      # DIFFÉRENTE de celle des APK GitHub. Deux distributions au même appId avec deux signatures
      # ne peuvent ni coexister ni se remplacer — un identifiant neuf n'orpheline personne.
      - name: Build STORE bundle + APK de contrôle (Play)
        working-directory: android
        run: |
          BUILD=$(grep -oP "const GAME_BUILD = \K[0-9]+" ../Archipel_industry_alpha-7.html | head -1)
          VERSION=$(grep -oP "const GAME_VERSION = '\K[^']+" ../Archipel_industry_alpha-7.html | head -1)
          cp ../game-store.html app/src/main/assets/index.html
          # ⚠ ASSERTIONS BLOQUANTES sur l'asset RÉELLEMENT embarqué, symétriques de celles de la
          # publique et de la dev : c'est le seul contrôle qui attrape une inversion de `cp`.
          grep -q "^const SELF_UPDATE = false;$" app/src/main/assets/index.html \
            || { echo "::error::l'asset du paquet magasin n'a pas la garde SELF_UPDATE"; exit 1; }
          [ "$(grep -c 'ko-fi' app/src/main/assets/index.html)" = "0" ] \
            || { echo "::error::le lien de soutien subsiste dans l'asset du paquet magasin"; exit 1; }
          grep -q "^const DEV_BUILD = false;$" app/src/main/assets/index.html \
            || { echo "::error::l'asset du paquet magasin n'est pas l'edition publique"; exit 1; }
          ./gradlew bundleRelease assembleRelease --no-daemon --stacktrace \
            -PstoreBuild=true \
            -Pvcode="${BUILD:-1}" -Pvname="${VERSION:-1.0}" \
            -PappId="fr.archipel.industry.store" \
            -PappLabel="Archipel Industry"
          cp app/build/outputs/bundle/release/app-release.aab ../ArchipelIndustry.aab
          # Un build release SANS keystore sort en `app-release-unsigned.apk` : on prend ce qui existe.
          APK=$(ls app/build/outputs/apk/release/app-release*.apk | head -1)
          cp "$APK" ../ArchipelIndustryStore.apk
          # L'asset embarqué DANS le bundle (un .aab est un ZIP) — et non le fichier intermédiaire.
          unzip -p ../ArchipelIndustry.aab base/assets/index.html > /tmp/aab-asset.html
          grep -q "^const SELF_UPDATE = false;$" /tmp/aab-asset.html \
            || { echo "::error::l'asset EXTRAIT du bundle n'a pas la garde SELF_UPDATE"; exit 1; }
          [ "$(grep -c 'ko-fi' /tmp/aab-asset.html)" = "0" ] \
            || { echo "::error::le lien de soutien subsiste dans l'asset EXTRAIT du bundle"; exit 1; }
          # CONTRE-MESURE : les mêmes greps sur l'asset de l'APK PUBLIQUE doivent donner l'INVERSE.
          # Sans elle, un extracteur qui rendrait une chaîne vide passerait au vert.
          unzip -p ../ArchipelIndustry.apk assets/index.html > /tmp/pub-asset.html
          grep -q "^const SELF_UPDATE = true;$" /tmp/pub-asset.html \
            || { echo "::error::contre-mesure KO : l'APK publique devrait garder l'auto-updater"; exit 1; }
          [ "$(grep -c 'ko-fi' /tmp/pub-asset.html)" = "1" ] \
            || { echo "::error::contre-mesure KO : l'APK publique devrait garder le lien de soutien"; exit 1; }
          echo "asset magasin et contre-mesure publique : conformes"

      - name: Assert store package (paquet, targetSdk, permissions, debuggable)
        run: |
          # `aapt2 dump badging` ne lit pas un .aab : on interroge l'APK construit avec le MÊME
          # manifeste et les MÊMES propriétés, ce qui vaut contrôle du manifeste du bundle.
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1)
          [ -n "$AAPT" ] || { echo "::error::aapt2 introuvable"; exit 1; }
          BADGE=$("$AAPT" dump badging ArchipelIndustryStore.apk)
          BUILD=$(grep -oP "const GAME_BUILD = \K[0-9]+" Archipel_industry_alpha-7.html | head -1)
          # Trace intégrale de l'en-tête : c'est elle qui a montré qu'aapt2 36 n'émet plus la
          # ligne `sdkVersion:` sous ce nom. On garde le dump, il sert au prochain qui doute.
          echo "$BADGE" | head -12
          echo "$BADGE" | grep -q "package: name='fr.archipel.industry.store'" \
            || { echo "::error::appId magasin inattendu"; exit 1; }
          echo "$BADGE" | grep -q "versionCode='${BUILD}'" \
            || { echo "::error::versionCode != GAME_BUILD ($BUILD)"; exit 1; }
          echo "$BADGE" | grep -q "targetSdkVersion:'36'" \
            || { echo "::error::targetSdkVersion != 36 — Play refuserait le depot"; exit 1; }
          # ⚠ `aapt2` étiquette le minSdk `sdkVersion:` (build-tools 34) ou `minSdkVersion:`
          # (build-tools 36) selon la version — on accepte les DEUX, mais on échoue si AUCUNE
          # n'est trouvée : un garde qui se désarme tout seul ne garde rien.
          echo "$BADGE" | grep -Eq "^(sdkVersion|minSdkVersion):'26'" \
            || { echo "::error::minSdk != 26 (ou etiquette aapt2 inconnue — voir le dump ci-dessus)"; exit 1; }
          [ "$(echo "$BADGE" | grep -c '^uses-permission:')" = "0" ] \
            || { echo "::error::le paquet magasin declare des permissions"; exit 1; }
          echo "$BADGE" | grep -q "^application-debuggable" \
            && { echo "::error::le paquet magasin est debuggable"; exit 1; }
          # CONTRE-MESURE : l'APK publique, elle, DOIT déclarer ses 2 permissions — sinon c'est le
          # compteur qui est faux, pas le paquet magasin qui est propre.
          [ "$("$AAPT" dump badging ArchipelIndustry.apk | grep -c '^uses-permission:')" = "2" ] \
            || { echo "::error::contre-mesure KO : l'APK publique devrait declarer 2 permissions"; exit 1; }
          echo "paquet magasin : 0 permission, targetSdk 36, non debuggable — contre-mesure OK"

      - name: Assert appIds (les 2 éditions doivent être installables côte à côte)
        run: |
          # ⚠ Ce garde-fou est le SEUL rempart contre deux APK au même appId (l'un écraserait
          # l'autre à l'installation, et avec lui sa sauvegarde). Il ne doit donc PAS se désarmer
          # tout seul : si aucun outil n'est trouvable, on ÉCHOUE. build-tools;34.0.0 est installé
          # explicitement par une étape précédente, aapt2 y est toujours.
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1)
          [ -n "$AAPT" ] || AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt 2>/dev/null | sort -V | tail -1)
          [ -n "$AAPT" ] \
            || { echo "::error::ni aapt2 ni aapt trouvables — impossible de verifier les appId"; exit 1; }
          pkg() { "$AAPT" dump badging "$1" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -1; }
          PUB=$(pkg ArchipelIndustry.apk); DEV=$(pkg ArchipelIndustryDev.apk)
          echo "publique = $PUB"; echo "dev      = $DEV"
          [ "$PUB" = "fr.archipel.industry.pub" ] \
            || { echo "::error::appId publique inattendu : '$PUB' (attendu fr.archipel.industry.pub)"; exit 1; }
          [ "$DEV" = "fr.archipel.industry" ] \
            || { echo "::error::appId dev inattendu : '$DEV' (attendu fr.archipel.industry)"; exit 1; }
          [ "$PUB" != "$DEV" ] \
            || { echo "::error::les 2 APK partagent le même appId — installation côte à côte impossible"; exit 1; }

      # --- P4 : APK de TEST portant le relevé d'insets --------------------------------------
      # La variante B (aucun rembourrage natif, le CSS fait tout) a été retenue sur appareil ; la
      # variante A est supprimée, il n'y a plus de bascule. Cet APK est la MÊME coquille que les
      # trois paquets, avec en plus l'afficheur de diagnostic (-PinsetDiag=true) — c'est lui qui
      # donne les valeurs d'insets natives ET le `env(safe-area-inset-*)` calculé par la WebView,
      # impossibles à mesurer sans appareil.
      # ⚠ Il garde l'appId DEV : il remplace l'app dev installée (sauvegarde conservée). Le libellé
      # « Archipel P4 » dit qu'il s'agit du build de test.
      # ⚠ TEMPORAIRE : cette étape disparaît avec l'afficheur.
      - name: Build P4 inset test APK
        working-directory: android
        run: |
          BUILD=$(grep -oP "const GAME_BUILD = \K[0-9]+" ../Archipel_industry_alpha-7.html | head -1)
          VERSION=$(grep -oP "const GAME_VERSION = '\K[^']+" ../Archipel_industry_alpha-7.html | head -1)
          cp ../game-dev.html app/src/main/assets/index.html
          # L'étape magasin a laissé SON asset en place : sans ce contrôle, l'APK de test
          # partirait avec l'édition magasin et le diagnostic porterait sur le mauvais jeu.
          grep -q "^const DEV_BUILD = true;$" app/src/main/assets/index.html \
            || { echo "::error::l'asset de l'APK de test P4 n'est pas l'edition dev"; exit 1; }
          ./gradlew assembleDebug --no-daemon --stacktrace \
            -Pvcode="${BUILD:-1}" -Pvname="${VERSION:-1.0}" \
            -PappLabel="Archipel P4" \
            -PinsetDiag=true
          cp app/build/outputs/apk/debug/app-debug.apk ../ArchipelIndustryDev-P4.apk

      - name: Assert P4 test APK
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1)
          [ -n "$AAPT" ] || { echo "::error::aapt2 introuvable"; exit 1; }
          lbl() { "$AAPT" dump badging "$1" | sed -n "s/^application-label:'\([^']*\)'.*/\1/p" | head -1; }
          P4=$(lbl ArchipelIndustryDev-P4.apk)
          echo "P4 = $P4"
          [ "$P4" = "Archipel P4" ] || { echo "::error::libelle P4 inattendu : '$P4'"; exit 1; }
          # Contre-mesure : les APK NORMAUX ne doivent PAS embarquer l'afficheur de diagnostic,
          # donc pas porter le libellé de test — sinon c'est le build de test qui les a écrasés.
          for APK in ArchipelIndustry.apk ArchipelIndustryDev.apk; do
            case "$(lbl "$APK")" in
              *P4*) echo "::error::$APK a ete ecrase par le build de test P4"; exit 1 ;;
            esac
          done
          echo "APK de test P4 present, paquets normaux intacts"

      - name: Upload P4 inset test APK
        uses: actions/upload-artifact@v4
        with:
          name: ArchipelIndustry-P4-DIAG
          path: |
            ArchipelIndustryDev-P4.apk
          if-no-files-found: error

      - name: Show signing certificate (vérifie la clé stable)
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          # Le bundle magasin est signé en JAR (META-INF) : apksigner ne le lit pas, jarsigner si.
          # C'est la clé stable qui doit apparaître ici — Play App Signing re-signera par-dessus.
          echo "=== Certificat de signature : ArchipelIndustry.aab ==="
          jarsigner -verify -verbose:summary -certs ArchipelIndustry.aab 2>&1 \
            | grep -Ei "jar verified|CN=|SHA-256|non signé|not signed" | head -5 || true
          for APK in ArchipelIndustry.apk ArchipelIndustryDev.apk ArchipelIndustryStore.apk; do
            echo "=== Certificat de signature : $APK ==="
            if [ -n "$APKSIGNER" ]; then
              "$APKSIGNER" verify --print-certs "$APK" | grep -Ei "certificate DN|SHA-256" || true
            else
              echo "(apksigner introuvable)"
            fi
          done
          echo "Empreinte SHA-256 attendue (clé stable) : A259F77798C2B99C567EA70D6B3E94490E32FE924C3FDCEFD83332619A3962A3"
          if [ -f android/app/keystore.jks ]; then
            echo "✅ keystore.jks présent — signature stable."
          else
            echo "::warning::keystore.jks ABSENT — APK signé avec la clé debug (NON stable entre builds)."
          fi

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ArchipelIndustry-APK
          path: |
            ArchipelIndustry.apk
            ArchipelIndustryDev.apk
          if-no-files-found: error

      # Paquet magasin : téléversé en ARTEFACT UNIQUEMENT. Il n'entre PAS dans la Release
      # publique — un .aab n'est pas installable et n'a rien à faire dans une release destinée
      # au sideload. Le dépôt sur la Play Console appartient à Ethan.
      # L'APK magasin l'accompagne : c'est lui qui s'installe sur un appareil pour le test T4.
      - name: Upload store artifacts (.aab + APK de contrôle + HTML)
        uses: actions/upload-artifact@v4
        with:
          name: ArchipelIndustry-STORE
          path: |
            ArchipelIndustry.aab
            ArchipelIndustryStore.apk
            game-store.html
          if-no-files-found: error

      - name: Sync PWA (index.html + sw.js cache)
        run: |
          BUILD=$(grep -oP "const GAME_BUILD = \\K[0-9]+" Archipel_industry_alpha-7.html | head -1)
          # ⚠ La garde plus bas compare le sed à la MÊME variable : elle ne peut donc PAS
          # rattraper un BUILD faux. On valide donc la VALEUR ici — un entier non nul —, sinon
          # le cache du service worker partirait en `archipel-0` et ne se rafraîchirait jamais.
          case "$BUILD" in
            ''|*[!0-9]*|0) echo "::error::GAME_BUILD illisible ou nul ('$BUILD') — ligne const renommee/reformatee ?"; exit 1 ;;
          esac
          echo "PWA build=$BUILD"
          test -f game-public.html \
            || { echo "::error::game-public.html absent"; exit 1; }
          cp game-public.html index.html
          # ⚠ ASSERTION BLOQUANTE — NE JAMAIS RETIRER. `index.html` est la version web/PWA,
          # le SEUL canal des utilisateurs Apple : elle ne doit jamais être l'édition dev
          # (qui donne construction et améliorations gratuites).
          grep -q "^const DEV_BUILD = false;$" index.html \
            || { echo "::error::index.html n'est pas l'edition publique"; exit 1; }
          test -f sw.js || { echo "::error::sw.js absent"; exit 1; }
          sed -i "s/^var CACHE = 'archipel-[0-9]*';/var CACHE = 'archipel-$BUILD';/" sw.js
          grep -q "^var CACHE = 'archipel-$BUILD';$" sw.js \
            || { echo "::error::bump du cache SW echoue"; exit 1; }
          echo "sw.js -> $(grep '^var CACHE' sw.js)"

      - name: Publish to "apk-latest" release
        # Gate de branche : cette étape RECRÉE la release publique. Jamais depuis une branche.
        # ⚠ ORDRE VOULU : Publish tourne AVANT « Sync version.json ». On téléverse les assets
        # AVANT d'annoncer la version, sinon `version.json` pointerait un nom de fichier absent
        # de la release (404 pour le joueur) — d'autant plus que ce lot RENOMME l'asset public.
        # Si le push de l'annonce échoue ensuite, la release est bonne et les joueurs voient
        # simplement encore l'ancienne version : dégradation sûre.
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create apk-latest ArchipelIndustry.apk ArchipelIndustryDev.apk \
            --title "APK Android — dernière version" \
            --notes "Application Android **Archipel Industry** (hors-ligne) — deux éditions :

          - \`ArchipelIndustry.apk\` — **édition publique**. C'est celle à installer. Pas de mode développeur, pas de mode rapide. Même contenu que la version web.
          - \`ArchipelIndustryDev.apk\` — **édition dev** (construction gratuite + mode rapide ×10). Réservée au développement.

          Les deux s'installent côte à côte sur le même téléphone (identifiants d'application distincts).

          ⚠ **Si vous aviez déjà l'application installée**, elle correspond à l'édition **dev** : c'est \`ArchipelIndustryDev.apk\` qui la met à jour en conservant votre sauvegarde. Installer l'édition publique l'ajoute À CÔTÉ, avec une sauvegarde vierge.

          Installation :
          1. Téléchargez l'APK voulu ci-dessous.
          2. Ouvrez le fichier ; autorisez l'installation depuis cette source si demandé.
          3. Lancez **Archipel Industry** (publique) ou **Archipel Ind. Dev**.

          Construit automatiquement depuis \`Archipel_industry_alpha-7.html\`."

      - name: Sync version.json from the game's GAME_BUILD
        # Gate de branche : cette étape POUSSE sur main. Sur une branche, on ne publie rien.
        # ⚠ Elle vient APRÈS Publish : elle ANNONCE des assets qui existent déjà.
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BUILD=$(grep -oP "const GAME_BUILD = \K[0-9]+" Archipel_industry_alpha-7.html | head -1)
          VERSION=$(grep -oP "const GAME_VERSION = '\K[^']+" Archipel_industry_alpha-7.html | head -1)
          # 14.44 — Les notes viennent de GAME_NOTES, DANS le fichier de jeu, à côté de
          # l'étiquette qu'elles décrivent. Avant, c'était le sujet du dernier commit : après
          # une fusion de PR le joueur lisait « Merge pull request #NNN from … » sous
          # « Mise à jour disponible ». Repli sur le sujet de commit si la constante manque
          # (ancien fichier de jeu) ou est vide, pour ne jamais casser la publication.
          NOTES=$(grep -oP "const GAME_NOTES = \"\K[^\"]*" Archipel_industry_alpha-7.html | head -1)
          NOTES="${NOTES:-$(git log -1 --pretty=%s)}"
          echo "Notes: $NOTES"
          echo "Game build=$BUILD version=$VERSION"
          # `apk` = édition PUBLIQUE (canal par défaut, lu par tout build DEV_BUILD=false) ;
          # `apkDev` = édition DEV (lu uniquement par un build DEV_BUILD=true, avec repli sur
          # `apk` si le champ manque — cf. version.json antérieur).
          jq -n \
            --argjson build "${BUILD:-0}" \
            --arg version "${VERSION:-?}" \
            --arg url "https://github.com/freredoc/Archipel-Industry-/releases/tag/apk-latest" \
            --arg apk "https://github.com/freredoc/Archipel-Industry-/releases/download/apk-latest/ArchipelIndustry.apk" \
            --arg apkDev "https://github.com/freredoc/Archipel-Industry-/releases/download/apk-latest/ArchipelIndustryDev.apk" \
            --arg notes "$NOTES" \
            '{build:$build, version:$version, url:$url, apk:$apk, apkDev:$apkDev, notes:$notes}' > version.json
          if ! git diff --quiet version.json index.html sw.js; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add version.json index.html sw.js
            git commit -m "chore: sync version.json + PWA (build $BUILD) [skip ci]"
            git push origin HEAD:main \
              || echo "::warning::push de la synchro refuse (main a avance ?) — version.json/PWA NON publies"
          else
            echo "version.json + PWA already up to date."
          fi
